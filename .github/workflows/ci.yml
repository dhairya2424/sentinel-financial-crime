# CI gates from docs/10 §2 and docs/08 §9: secret scan, dependency audits, backend unit/integration/coverage,
# the scenario metrics report, and the frontend tests, types and lint. Any failure blocks the merge.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sentinel
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - name: unit
        run: pytest tests/unit -q
      - name: coverage (>=80% line on detection/ and risk/)
        run: |
          coverage run --source=app/detection,app/risk -m pytest tests/unit -q
          coverage report --fail-under=80
      - name: integration
        run: pytest tests/integration -q
      - name: scenarios (detection rate, false-positive rate, alert latency)
        run: pytest tests/scenarios -q --metrics

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: no dangerouslySetInnerHTML in app code (docs/08 §9)
        run: "! grep -rn dangerouslySetInnerHTML src --include=*.tsx --include=*.ts"
